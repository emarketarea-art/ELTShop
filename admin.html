<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS Admin — ELTShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fond: #F7F3EE; --blanc: #FFFFFF; --texte: #1A1410; --texte-2: #7A6A5A;
      --or: #B5893F; --pierre: #E8DDD2; --nav: #140F0A; --vert: #27AE60;
      --rouge: #C0392B; --bleu: #2980B9; --rayon: 10px; --ombre: 0 2px 16px rgba(26,20,10,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--fond);color:var(--texte);min-height:100vh}

    .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--nav)}
    .login-box{background:var(--blanc);border-radius:20px;padding:48px 40px;width:min(400px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .login-logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--or);letter-spacing:4px;text-transform:uppercase;margin-bottom:8px}
    .login-box h2{font-size:1rem;color:var(--texte-2);font-weight:400;margin-bottom:32px}
    .login-input{width:100%;padding:12px 16px;border:1.5px solid var(--pierre);border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;outline:none;margin-bottom:14px}
    .login-input:focus{border-color:var(--or)}
    .login-btn{width:100%;padding:13px;background:var(--or);color:var(--nav);border:none;border-radius:8px;font-weight:600;cursor:pointer;}
    .login-erreur{color:var(--rouge);font-size:.82rem;margin-top:12px;display:none}
    .login-erreur.visible{display:block}

    .admin-page{display:none}
    .admin-page.visible{display:block}
    .topbar{background:var(--nav);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4%,40px);position:sticky;top:0;z-index:100}
    .topbar-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--or);text-decoration:none}
    .topbar-droite{display:flex;gap:10px}
    .topbar-btn{background:none;border:1px solid rgba(255,255,255,.15);color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;font-size:.8rem}

    .admin-main{max-width:1100px;margin:0 auto;padding:36px clamp(16px,4%,40px)}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:32px}
    .stat-card{background:var(--blanc);border-radius:var(--rayon);padding:20px;box-shadow:var(--ombre)}
    .stat-label{font-size:.72rem;font-weight:600;color:var(--texte-2);text-transform:uppercase}
    .stat-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;}

    .actions-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .btn-ajouter{background:var(--or);color:var(--nav);padding:10px 22px;border:none;border-radius:8px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
    .recherche-admin{margin-left:auto;padding:9px 14px;border:1.5px solid var(--pierre);border-radius:8px;min-width:200px}

    .table-wrap { background:var(--blanc); border-radius:14px; box-shadow:var(--ombre); overflow-x:auto; -webkit-overflow-scrolling:touch; width:100%; }
table { min-width: 600px; /* Force le défilement au lieu d'écraser le texte */ }
    th{padding:14px 16px;text-align:left;font-size:.7rem;color:var(--texte-2);text-transform:uppercase;background:#FAF7F3}
    td{padding:14px 16px;border-top:1px solid var(--pierre);vertical-align:middle}
    .td-image img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:var(--pierre)}
    
    .btn-edit, .btn-del{background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;}
    .btn-edit{color:var(--bleu)} .btn-del{color:var(--rouge)}

    .form-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(20,15,10,.6);align-items:center;justify-content:center;padding:20px}
    .form-overlay.ouverte{display:flex}
    .form-modal{background:#fff;border-radius:20px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;}
    .form-header{display:flex;justify-content:space-between;padding:24px;border-bottom:1px solid var(--pierre)}
    .form-corps{padding:24px;display:flex;flex-direction:column;gap:18px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-label{font-size:.75rem;font-weight:600;color:var(--texte-2);text-transform:uppercase}
    .form-input, .form-select, .form-textarea{padding:11px;border:1.5px solid var(--pierre);border-radius:8px;font-family:inherit;}
    .form-textarea{min-height:80px}
    
    .galerie-previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .galerie-preview-item{position:relative;width:72px;height:72px;}
    .galerie-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
    .btn-suppr-img{position:absolute;top:-6px;right:-6px;background:var(--rouge);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;}

    .tags-input-wrap{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border:1.5px solid var(--pierre);border-radius:8px;min-height:48px;cursor:text}
    .tag-chip{background:var(--fond);border:1px solid var(--pierre);padding:3px 10px;border-radius:100px;font-size:.78rem;display:flex;align-items:center;gap:5px}
    .tag-chip button{background:none;border:none;color:var(--rouge);cursor:pointer}
    .tags-input{border:none;outline:none;flex:1;background:transparent;font-family:inherit}

    .form-footer{display:flex;gap:10px;justify-content:flex-end;padding-top:10px;border-top:1px solid var(--pierre)}
    .btn-annuler{background:transparent;border:1.5px solid var(--pierre);padding:11px 22px;border-radius:8px;cursor:pointer}
    .btn-sauver{background:var(--or);color:var(--nav);padding:11px 28px;border:none;border-radius:8px;font-weight:600;cursor:pointer}

    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--nav);color:#fff;padding:12px 24px;border-radius:100px;font-size:.85rem;z-index:1000;transition:transform .4s;opacity:0}
    .toast.visible{transform:translateX(-50%) translateY(0);opacity:1}
    
    .promo-text { color: var(--rouge); font-size: 0.8rem; font-weight: bold; }
  </style>
</head>
<body>

  <!-- PAGE DE CONNEXION -->
  <div class="login-page" id="login-page">
    <div class="login-box">
      <div class="login-logo">ELTShop</div>
      <h2>Administration sécurisée</h2>
      <input class="login-input" type="email" id="login-email" placeholder="Adresse email" />
      <input class="login-input" type="password" id="login-pwd" placeholder="Mot de passe" />
      <button class="login-btn" onclick="seConnecter()">Se connecter →</button>
      <p class="login-erreur" id="login-erreur">Identifiants incorrects</p>
    </div>
  </div>

  <!-- PAGE ADMIN -->
  <div class="admin-page" id="admin-page">
    <div class="topbar">
      <div class="topbar-logo">ELTShop Admin</div>
      <div class="topbar-droite">
        <a href="index.html" class="topbar-btn" target="_blank">Voir le site</a>
        <button class="topbar-btn" onclick="seDeconnecter()">Déconnexion</button>
      </div>
    </div>

    <div class="admin-main">
      <div class="stats-grid" id="stats-grid"></div>

      <div class="actions-bar">
        <button class="btn-ajouter" onclick="ouvrirFormulaire()">+ Ajouter un article</button>
        <input class="recherche-admin" type="text" placeholder="Rechercher..." oninput="rechercherAdmin(this.value)" />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:60px">Image</th>
              <th>Nom</th>
              <th>Catégorie</th>
              <th>Prix</th>
              <th>Stock</th>
              <th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FORMULAIRE -->
  <div class="form-overlay" id="form-overlay" onclick="fermerSiOverlay(event)">
    <div class="form-modal" id="form-modal">
      <div class="form-header">
        <h2 class="form-titre" id="form-titre">Ajouter un article</h2>
        <button class="btn-form-fermer" onclick="fermerFormulaire()">✕</button>
      </div>

      <div class="form-corps">
        <div class="form-group-row">
          <div class="form-group">
            <label class="form-label">Nom de l'article *</label>
            <input class="form-input" type="text" id="f-nom" />
          </div>
          <div class="form-group">
            <label class="form-label">Catégorie *</label>
            <input class="form-input" type="text" id="f-cat" list="cats-list" />
            <datalist id="cats-list"></datalist>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label class="form-label">Prix actuel *</label>
            <input class="form-input" type="number" id="f-prix" />
          </div>
          <div class="form-group">
            <label class="form-label">Ancien Prix (Optionnel - Promo)</label>
            <input class="form-input" type="number" id="f-prix-barre" placeholder="Sera barré en rouge" />
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label class="form-label">Stock disponible</label>
            <input class="form-input" type="number" id="f-stock" value="10" />
          </div>
          <div class="form-group">
            <label class="form-label">Devise</label>
            <select class="form-select" id="f-devise">
              <option>FCFA</option><option>EUR</option><option>USD</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="f-desc"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Ajouter des photos (compressées auto)</label>
          <input class="form-input" type="file" id="f-img-input" accept="image/*" multiple onchange="gererUploadImages(event)" />
          <div class="galerie-previews" id="galerie-previews"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Tailles (Entrée pour valider)</label>
          <div class="tags-input-wrap" id="tailles-wrap" onclick="document.getElementById('tailles-input').focus()">
            <input class="tags-input" id="tailles-input" onkeydown="ajouterTag(event,'tailles')" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Couleurs (Entrée pour valider)</label>
          <div class="tags-input-wrap" id="couleurs-wrap" onclick="document.getElementById('couleurs-input').focus()">
            <input class="tags-input" id="couleurs-input" onkeydown="ajouterTag(event,'couleurs')" />
          </div>
        </div>

        <div class="form-footer">
          <button class="btn-annuler" onclick="fermerFormulaire()">Annuler</button>
          <button class="btn-sauver" id="btn-sauver" onclick="sauvegarderProduit()">💾 Sauvegarder</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* =====================================================
       INITIALISATION SUPABASE
       !! REMPLACE PAR TES CLES !!
    ===================================================== */
    const supabaseUrl = 'https://ptjqyahqfxiycuulvelj.supabase.co';
    const supabaseKey = 'sb_publishable_o5tQyfF9ma5hCTLXyBrdDw_gQB9OShu';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let produits = [];
    let produitEnEdition = null; 
    let taillesEnCours = [];
    let couleursEnCours = [];
    let imagesEnCours = []; // URLs finales
    let termeRecherche = '';

    function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
    }

    /* VÉRIFICATION DE SESSION INTELLIGENTE */
    async function verifierSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('admin-page').classList.add('visible');
        chargerDonnees();
      } else {
        document.getElementById('login-page').style.display = 'flex';
        document.getElementById('admin-page').classList.remove('visible');
      }
    }

    verifierSession();

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') verifierSession();
    });

    async function seConnecter() {
      const email = document.getElementById('login-email').value;
      const pwd = document.getElementById('login-pwd').value;
      const btn = document.querySelector('.login-btn');
      if (!email || !pwd) return;
      btn.textContent = '…';
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });
      btn.textContent = 'Se connecter →';
      if (error) document.getElementById('login-erreur').classList.add('visible');
    }

    async function seDeconnecter() { await supabaseClient.auth.signOut(); }

    async function chargerDonnees() {
      const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (error) return afficherToast('❌ Erreur chargement');
      produits = data || [];
      rendrePage();
    }

    function rendrePage() {
      const tbody = document.getElementById('tbody');
      const filtres = termeRecherche ? produits.filter(p => p.nom.toLowerCase().includes(termeRecherche)) : produits;
      
      tbody.innerHTML = filtres.map(p => `
        <tr>
          <td class="td-image"><img src="${p.image}" onerror="this.src=''" /></td>
          <td><b>${escapeHTML(p.nom)}</b><br><span style="font-size:0.75rem;color:gray">${p.id}</span></td>
          <td>
  ${escapeHTML(p.categorie)}<br>
  <span style="font-size:0.7rem;color:gray">${(p.tailles||[]).join(', ')}</span><br>
  <span style="font-size:0.7rem;color:gray">${(p.couleurs||[]).join(', ')}</span>
</td>
          <td>
            ${p.prix.toLocaleString()} ${escapeHTML(p.devise)}
            ${p.prix_barre ? `<br><s style="color:red;font-size:0.8rem">${p.prix_barre.toLocaleString()}</s>` : ''}
          </td>
          <td><b>${p.stock || 0}</b></td>
          <td style="text-align:right">
            <button class="btn-edit" onclick="modifierProduit(${p.id})">✏️</button>
            <button class="btn-del" onclick="supprimerProduit(${p.id})">🗑️</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Total Articles</div><div class="stat-val">${produits.length}</div></div>
        <div class="stat-card"><div class="stat-label">Valeur du Stock</div><div class="stat-val">${produits.reduce((s, p) => s + (p.prix * (p.stock||0)), 0).toLocaleString()}</div></div>
      `;
      remplirDatalistCats();
    }

    function remplirDatalistCats() {
      const cats = [...new Set(produits.map(p => p.categorie))];
      document.getElementById('cats-list').innerHTML = cats.map(c => `<option value="${escapeHTML(c)}">`).join('');
    }

    function rechercherAdmin(val) { termeRecherche = val.toLowerCase(); rendrePage(); }

    /* =====================================================
       ALGORITHME DE COMPRESSION D'IMAGE (Côté Navigateur)
    ===================================================== */
    async function compresserImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000; // Largeur HD adaptée aux mobiles
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Compression en WebP à 80% (Poids divisé par 20 !)
            canvas.toBlob((blob) => {
              resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".webp", { type: 'image/webp' }));
            }, 'image/webp', 0.8);
          }
        }
      });
    }

    async function gererUploadImages(event) {
      const files = event.target.files;
      const btn = document.getElementById('btn-sauver');
      
      if(files.length === 0) return;
      btn.disabled = true;
      btn.textContent = "⏳ Compression & Upload...";

      for(let i=0; i<files.length; i++) {
        try {
          // 1. Compresser l'image sur le téléphone
          const fichierCompresse = await compresserImage(files[i]);
          
          // 2. L'envoyer sur Supabase
          const nomUnique = `${Date.now()}_${Math.random().toString(36).substring(7)}.webp`;
          const { error } = await supabaseClient.storage.from('produits').upload(nomUnique, fichierCompresse);
          
          if(error) throw error;

          // 3. Récupérer l'URL publique
          const { data } = supabaseClient.storage.from('produits').getPublicUrl(nomUnique);
          imagesEnCours.push(data.publicUrl);
          rendreGalerieForm();
          
        } catch (err) {
          afficherToast('❌ Erreur upload photo');
          console.error(err);
        }
      }
      btn.disabled = false;
      btn.textContent = "💾 Sauvegarder";
      event.target.value = ''; // Reset l'input
    }

    function rendreGalerieForm() {
      document.getElementById('galerie-previews').innerHTML = imagesEnCours.map((url, i) => `
        <div class="galerie-preview-item">
          <img src="${url}" />
          <button class="btn-suppr-img" type="button" onclick="supprimerImageGalerie(${i})">✕</button>
        </div>
      `).join('');
    }
    function supprimerImageGalerie(idx) { imagesEnCours.splice(idx, 1); rendreGalerieForm(); }

    /* =====================================================
       FORMULAIRE & TAGS
    ===================================================== */
    function ouvrirFormulaire(p = null) {
      produitEnEdition = p ? p.id : null;
      taillesEnCours = p ? [...(p.tailles||[])] : [];
      couleursEnCours = p ? [...(p.couleurs||[])] : [];
      imagesEnCours = p ? [...(p.images||[])] : [];

      document.getElementById('form-titre').textContent = p ? 'Modifier article' : 'Ajouter article';
      document.getElementById('f-nom').value = p ? p.nom : '';
      document.getElementById('f-cat').value = p ? p.categorie : '';
      document.getElementById('f-prix').value = p ? p.prix : '';
      document.getElementById('f-prix-barre').value = p ? (p.prix_barre || '') : '';
      document.getElementById('f-stock').value = p ? (p.stock || 0) : 10;
      document.getElementById('f-devise').value = p ? p.devise : 'FCFA';
      document.getElementById('f-desc').value = p ? p.description : '';
      
      rendreGalerieForm(); rendreTags('tailles'); rendreTags('couleurs');
      document.getElementById('form-overlay').classList.add('ouverte');
    }

    function modifierProduit(id) { const p = produits.find(x => x.id === id); if (p) ouvrirFormulaire(p); }
    function fermerFormulaire() { document.getElementById('form-overlay').classList.remove('ouverte'); }
    function fermerSiOverlay(e) { if (e.target === document.getElementById('form-overlay')) fermerFormulaire(); }

    function ajouterTag(e, type) {
      if (e.key !== 'Enter' && e.key !== ',') return;
      e.preventDefault();
      const input = document.getElementById(`${type}-input`);
      const val = input.value.trim().replace(/,$/, '');
      if (!val) return;
      const arr = type === 'tailles' ? taillesEnCours : couleursEnCours;
      if (!arr.includes(val)) { arr.push(val); rendreTags(type); }
      input.value = '';
    }
    function supprimerTag(type, val) {
      if (type === 'tailles') taillesEnCours = taillesEnCours.filter(t => t !== val);
      else couleursEnCours = couleursEnCours.filter(c => c !== val);
      rendreTags(type);
    }
    function rendreTags(type) {
      const arr = type === 'tailles' ? taillesEnCours : couleursEnCours;
      const wrap = document.getElementById(`${type}-wrap`);
      const input = document.getElementById(`${type}-input`);
      wrap.innerHTML = '';
      arr.forEach(v => {
        const span = document.createElement('span');
        span.className = 'tag-chip';
        span.innerHTML = `${escapeHTML(v)}<button type="button" onclick="supprimerTag('${type}','${escapeHTML(v)}')">×</button>`;
        wrap.appendChild(span);
      });
      wrap.appendChild(input);
    }

    /* =====================================================
       SAUVEGARDE DB
    ===================================================== */
   async function sauvegarderProduit() {
      // 1. Découpage automatique si tu as tapé des virgules (ex: "S, M, L") sans faire "Entrée"
      const tInput = document.getElementById('tailles-input').value;
      if (tInput) {
        tInput.split(',').forEach(val => {
          const cleanVal = val.trim();
          if (cleanVal && !taillesEnCours.includes(cleanVal)) taillesEnCours.push(cleanVal);
        });
      }

      const cInput = document.getElementById('couleurs-input').value;
      if (cInput) {
        cInput.split(',').forEach(val => {
          const cleanVal = val.trim();
          if (cleanVal && !couleursEnCours.includes(cleanVal)) couleursEnCours.push(cleanVal);
        });
      }

      // 2. Vérification des champs obligatoires
      const nom = document.getElementById('f-nom').value.trim();
      const cat = document.getElementById('f-cat').value.trim();
      const prix = parseFloat(document.getElementById('f-prix').value);
      const prix_barre = parseFloat(document.getElementById('f-prix-barre').value) || null;
      const stock = parseInt(document.getElementById('f-stock').value) || 0;
      
      if (!nom || !cat || isNaN(prix) || imagesEnCours.length === 0) {
        return afficherToast('⚠️ Remplissez Nom, Catégorie, Prix et ajoutez au moins 1 photo.');
      }

      document.getElementById('btn-sauver').disabled = true;
      document.getElementById('btn-sauver').textContent = "Enregistrement...";

      const dataProd = {
        nom, categorie: cat, prix, prix_barre, stock,
        devise: document.getElementById('f-devise').value,
        description: document.getElementById('f-desc').value.trim(),
        image: imagesEnCours[0], images: imagesEnCours,
        tailles: taillesEnCours, couleurs: couleursEnCours
      };

      if (produitEnEdition) {
        await supabaseClient.from('products').update(dataProd).eq('id', produitEnEdition);
        afficherToast('✓ Modifié avec succès');
      } else {
        await supabaseClient.from('products').insert([dataProd]);
        afficherToast('✓ Ajouté avec succès');
      }

      document.getElementById('btn-sauver').disabled = false;
      document.getElementById('btn-sauver').textContent = "💾 Sauvegarder";
      fermerFormulaire();
      chargerDonnees();
    }

    async function supprimerProduit(id) {
      if (!confirm(`Supprimer cet article ?`)) return;
      await supabaseClient.from('products').delete().eq('id', id);
      afficherToast('🗑️ Article supprimé');
      chargerDonnees();
    }

    function afficherToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('visible');
      setTimeout(() => t.classList.remove('visible'), 3000);
    }
  </script>
</body>
</html>
